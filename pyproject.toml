[project]
name = "ranger"
version = "0.1.0"
description = "Preferred-node failover for two Docker Compose hosts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "uv>=0.11",
    "workers-py>=1.17.4",
    "workers-runtime-sdk>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["docker: disposable Docker Compose integration"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
