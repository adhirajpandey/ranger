[project]
name = "ranger"
version = "0.1.0"
description = "Preferred-node failover for two Docker Compose hosts"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ranger-agent = "ranger.agent:main"
ranger-preflight = "ranger.preflight:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "uv>=0.11",
    "workers-py>=1.17.4",
    "workers-runtime-sdk>=1.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
