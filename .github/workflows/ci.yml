name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main never cancels a deploy that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: uv sync --locked
      - run: npm ci

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test, including the Docker Compose integration
        run: uv run pytest -q
        env:
          RUN_DOCKER_TESTS: "1"

      - name: Package the Worker
        run: uv run pywrangler deploy --dry-run

      - name: Install the agent as a uv tool
        run: |
          uv tool install .
          "$(uv tool dir --bin)/ranger-agent" --help

      - name: Deploy the Worker and check status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLUSTER_CONFIG: ${{ secrets.RANGER_CLUSTER_CONFIG }}
          WORKER_SECRETS: ${{ secrets.RANGER_WORKER_SECRETS }}
          STATUS_URL: ${{ secrets.RANGER_STATUS_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set, so there is nothing to deploy."
            exit 0
          fi

          printf '%s\n' "$CLUSTER_CONFIG" > "$RUNNER_TEMP/cluster.json"
          printf '%s\n' "$WORKER_SECRETS" > "$RUNNER_TEMP/worker.env"
          # Wrangler prints node bindings and service IDs; keep them out of the log.
          jq -r '.nodes | to_entries[] | .key, .value.agent_binding, .value.vpc_service_id' \
            "$RUNNER_TEMP/cluster.json" | while read -r value; do echo "::add-mask::$value"; done

          PYTHONPATH=src uv run python scripts/configure-worker.py "$RUNNER_TEMP/cluster.json"
          uv run pywrangler deploy --config wrangler.local.jsonc \
            --secrets-file "$RUNNER_TEMP/worker.env"

          token="$(sed -n 's/^STATUS_TOKEN=//p' "$RUNNER_TEMP/worker.env")"
          echo "::add-mask::$token"
          deadline=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" "$STATUS_URL/status" || true)"
            if [ "$code" = 200 ]; then
              echo "Worker status is healthy."
              exit 0
            fi
            echo "Status returned HTTP $code; waiting for HTTP 200."
            sleep 15
          done
          echo "::error::Worker status did not return HTTP 200 within 3 minutes of the deploy."
          exit 1
