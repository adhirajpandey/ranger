name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main never cancels a deploy that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: uv sync --locked
      - run: npm ci

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test, including the Docker Compose integration
        run: uv run pytest -q
        env:
          RUN_DOCKER_TESTS: "1"

      - name: Package the Worker
        run: uv run pywrangler deploy --dry-run

      - name: Install the agent as a uv tool
        run: |
          uv tool install .
          "$(uv tool dir --bin)/ranger-agent" --help

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without deploy credentials
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN is not set, so there is nothing to deploy."
          fi

      - if: steps.gate.outputs.enabled
        uses: actions/checkout@v7
      - if: steps.gate.outputs.enabled
        uses: astral-sh/setup-uv@v10.2.0
      - if: steps.gate.outputs.enabled
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.enabled
        run: |
          uv sync --locked
          npm ci

      - name: Write the cluster configuration and Worker secrets
        if: steps.gate.outputs.enabled
        env:
          CLUSTER_CONFIG: ${{ secrets.RANGER_CLUSTER_CONFIG }}
          WORKER_SECRETS: ${{ secrets.RANGER_WORKER_SECRETS }}
        run: |
          printf '%s\n' "$CLUSTER_CONFIG" > "$RUNNER_TEMP/cluster.json"
          printf '%s\n' "$WORKER_SECRETS" > "$RUNNER_TEMP/worker.env"
          # Wrangler prints node bindings and service IDs; keep them out of the log.
          jq -r '.nodes | to_entries[] | .key, .value.agent_binding, .value.vpc_service_id' \
            "$RUNNER_TEMP/cluster.json" | while read -r value; do echo "::add-mask::$value"; done

      - name: Render the Wrangler configuration
        if: steps.gate.outputs.enabled
        run: PYTHONPATH=src uv run python scripts/configure-worker.py "$RUNNER_TEMP/cluster.json"

      - name: Deploy the Worker and its secrets
        if: steps.gate.outputs.enabled
        id: deploy
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          uv run pywrangler deploy --config wrangler.local.jsonc \
            --secrets-file "$RUNNER_TEMP/worker.env"

      - name: Wait for a controller cycle after the deploy
        if: steps.gate.outputs.enabled
        env:
          STATUS_URL: ${{ secrets.RANGER_STATUS_URL }}
          STARTED: ${{ steps.deploy.outputs.started }}
        run: |
          token="$(sed -n 's/^STATUS_TOKEN=//p' "$RUNNER_TEMP/worker.env")"
          echo "::add-mask::$token"
          deadline=$(( $(date +%s) + 180 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -sS -m 20 -o "$RUNNER_TEMP/status.json" -w '%{http_code}' \
              -H "Authorization: Bearer $token" "$STATUS_URL/status" || true)"
            if [ "$code" = 200 ] &&
              jq -e --argjson started "$STARTED" '.last_cycle > $started' \
                "$RUNNER_TEMP/status.json" > /dev/null; then
              echo "A controller cycle finished after the deploy."
              exit 0
            fi
            echo "Status returned HTTP $code without a new cycle yet."
            sleep 15
          done
          echo "::error::No controller cycle finished within 3 minutes of the deploy."
          exit 1
