name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: uv sync --locked
      - run: npm ci

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test, including the Docker Compose integration
        run: uv run pytest -q
        env:
          RUN_DOCKER_TESTS: "1"

      - name: Package the Worker
        run: uv run pywrangler deploy --dry-run
