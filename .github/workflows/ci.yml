name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main never cancels a deploy that is already running.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: uv sync --locked
      - run: npm ci

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test, including the Docker Compose integration
        run: uv run pytest -q
        env:
          RUN_DOCKER_TESTS: "1"

      - name: Package the Worker
        run: uv run pywrangler deploy --dry-run

      - name: Install the agent as a uv tool
        run: |
          uv tool install .
          "$(uv tool dir --bin)/ranger-agent" --help
          "$(uv tool dir --bin)/ranger-preflight" --help

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: uv sync --locked
      - run: npm ci

      - name: Configure the Worker
        env:
          CLUSTER_CONFIG: ${{ secrets.RANGER_CLUSTER_CONFIG }}
        run: |
          printf '%s\n' "$CLUSTER_CONFIG" > "$RUNNER_TEMP/cluster.json"
          PYTHONPATH=src uv run python scripts/configure-worker.py "$RUNNER_TEMP/cluster.json"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy --config wrangler.local.jsonc
